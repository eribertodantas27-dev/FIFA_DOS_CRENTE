<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrador - FC Championship</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #111827;
        }

        p {
            text-align: center;
            color: #6b7280;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 0;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1f2937;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .erro {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🔐 Administrador</h1>

    <p>FC Championship</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="erro">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="Digite a senha"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

    <a class="voltar" href="{{ url_for('index') }}">
        ← Voltar para o campeonato
    </a>

</div>

</body>
</html>
