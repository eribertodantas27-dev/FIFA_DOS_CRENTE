<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador</title><style>body{font-family:Arial;background:#f4f6f8;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:25px;border-radius:15px;width:min(400px,90%)}input,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:8px;border:1px solid #ccc}button{background:#111827;color:white}</style></head><body><div class="card"><h1>Área do administrador</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<p>{{m}}</p>{% endfor %}{% endwith %}<form method="post"><input type="password" name="password" placeholder="Senha" required><button>Entrar</button></form><a href="{{url_for('index')}}">Voltar</a></div></body></html>
