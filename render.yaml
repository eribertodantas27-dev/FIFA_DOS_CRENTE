services:
  - type: web
    name: fc-championship
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fc-championship-db
          property: connectionString
databases:
  - name: fc-championship-db
    plan: free
